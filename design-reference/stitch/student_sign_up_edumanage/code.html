<body class="bg-[#F7F5F0] min-h-screen flex items-center justify-center p-4 md:p-8 font-body-md text-on-surface antialiased selection:bg-[#C6A15B]/20 selection:text-primary">
<!-- Suppressed Navigation Shells per logic: "Linear/Transactional: Login, Sign-up, Onboarding..." -> Hide SideNavBar & TopAppBar -->
<!-- Main Registration Container -->
<main class="w-full max-w-[720px] mx-auto bg-[#FCFCFB] rounded-xl shadow-soft border border-[#E1E5EA] overflow-hidden">
<!-- Header Section -->
<div class="px-8 pt-10 pb-6 text-center border-b border-[#E1E5EA] relative">
<div class="flex justify-center mb-4">
<!-- Conceptual Logo Placeholder -->
<div class="w-16 h-16 rounded-lg bg-surface-container-high flex items-center justify-center text-primary border border-[#E1E5EA]">
<span class="material-symbols-outlined text-4xl" data-icon="school" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-2">Join EduManage</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your academic profile to access resources, courses, and schedules.</p>
</div>
<!-- Progress Indicator -->
<div class="px-8 py-6 bg-surface-bright border-b border-[#E1E5EA]">
<div class="flex items-center justify-between relative max-w-sm mx-auto">
<!-- Track Background -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-[#E1E5EA] z-0"></div>
<!-- Active Track -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-[2px] bg-[#C6A15B] z-0 transition-all duration-500"></div>
<!-- Step 1: Active -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-[#C6A15B] text-white flex items-center justify-center shadow-sm">
<span class="font-label-lg text-label-lg">1</span>
</div>
<span class="font-label-md text-label-md text-[#C6A15B] absolute -bottom-6 whitespace-nowrap">Personal Info</span>
</div>
<!-- Step 2: Inactive -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-[#FCFCFB] text-on-surface-variant flex items-center justify-center border-2 border-[#E1E5EA] box-content">
<span class="font-label-lg text-label-lg">2</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant absolute -bottom-6 whitespace-nowrap">Academic Profile</span>
</div>
<!-- Step 3: Inactive -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-[#FCFCFB] text-on-surface-variant flex items-center justify-center border-2 border-[#E1E5EA] box-content">
<span class="font-label-lg text-label-lg">3</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant absolute -bottom-6 whitespace-nowrap">Review</span>
</div>
</div>
</div>
<!-- Form Content Area -->
<div class="px-8 py-10 md:px-12 bg-[#FCFCFB]">
<h2 class="font-headline-sm text-headline-sm text-primary mb-6">Personal Information</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Name Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="firstName">First Name</label>
<input class="bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#C6A15B] focus:ring-1 focus:ring-[#C6A15B] transition-shadow outline-none" id="firstName" name="firstName" placeholder="Jane" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="lastName">Last Name</label>
<input class="bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#C6A15B] focus:ring-1 focus:ring-[#C6A15B] transition-shadow outline-none" id="lastName" name="lastName" placeholder="Doe" required="" type="text"/>
</div>
</div>
<!-- Email Row -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email Address</label>
<input class="bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#C6A15B] focus:ring-1 focus:ring-[#C6A15B] transition-shadow outline-none" id="email" name="email" placeholder="jane.doe@example.com" required="" type="email"/>
</div>
<!-- Additional Info Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:border-[#C6A15B] focus:ring-1 focus:ring-[#C6A15B] transition-shadow outline-none appearance-none" id="dob" name="dob" required="" type="date"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="phone">Phone Number (Optional)</label>
<input class="bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-[#C6A15B] focus:ring-1 focus:ring-[#C6A15B] transition-shadow outline-none" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Actions -->
<div class="pt-6 mt-4 flex items-center justify-between border-t border-[#E1E5EA]">
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary px-4 py-2 transition-colors" type="button">
                        Cancel
                    </button>
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-8 py-3 rounded-lg hover:bg-primary-container hover:shadow-soft transition-all duration-200 flex items-center gap-2" type="button">
                        Continue
                        <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>

</body></html>
