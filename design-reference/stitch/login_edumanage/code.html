<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1">
<label class="font-label-lg text-label-lg text-[#14213D]" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-[#14213D] placeholder:text-outline/50 focus:border-[#14213D] focus:ring-2 focus:ring-[#14213D]/20 outline-none transition-all duration-200" id="email" placeholder="scholar@university.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1 mt-2">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-[#14213D]" for="password">Password</label>
<a class="font-label-md text-label-md text-[#14213D] hover:text-[#0d1b36] transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-[#FCFCFB] border border-[#E1E5EA] rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-[#14213D] placeholder:text-outline/50 focus:border-[#14213D] focus:ring-2 focus:ring-[#14213D]/20 outline-none transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<button class="w-full bg-[#14213D] text-[#FCFCFB] font-label-lg text-label-lg rounded-lg py-3.5 px-6 hover:bg-[#0d1b36] hover:-translate-y-0.5 hover:shadow-lg hover:shadow-[#14213D]/20 active:translate-y-0 active:shadow-sm transition-all duration-200 ease-in-out flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-sm" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-xl w-full pt-md border-t border-[#E1E5EA] flex flex-col items-center gap-2">
<p class="font-body-md text-body-md text-on-surface-variant">
